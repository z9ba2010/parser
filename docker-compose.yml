version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sporthub_postgres_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: sporthub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sporthub_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sporthub"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: sporthub_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:sporthub_pass@db:5432/sporthub
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      ENABLE_MOCK_VISION_FALLBACK: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
